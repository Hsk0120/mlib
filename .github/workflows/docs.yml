name: Publish documentation

# workflowはこれ1つだけ。GitHub Pagesへの公開だけは、生成したHTMLをコミットしない限り
# 手元のバッチではできないため。整形・検査・テストは、手元で通してからpushする
# (_tools/format_mlib.bat と _tools/test_mlib.bat。手順は CONTRIBUTING.md)。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r _docs/requirements.txt
      - name: Build Sphinx documentation
        run: python -P -m sphinx -E -a -b html -n -W --keep-going _docs/source _docs/_build/html
      - name: Check pinned Mermaid in built HTML
        run: python _tools/check_mlib_docs.py --check-directory _docs/_build/html
      - name: Check preferred getter and predicate names and reference links
        run: python _tools/check_mlib_doc_getter_names.py _docs/_build/html
      - name: Stamp build revision
        run: python _tools/check_mlib_docs.py --stamp-directory _docs/_build/html --sha "$GITHUB_SHA"
      - name: Install browser tests
        run: |
          python -m pip install -r _docs/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify browser navigation before publication
        run: python _tools/check_mlib_docs.py --directory _docs/_build/html --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: docs-browser-before-deploy
          path: __tests__/_output/docs-browser/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  verify-publication:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install browser tests
        run: |
          python -m pip install -r _docs/browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify published revision and browser navigation
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python _tools/check_mlib_docs.py --url "$PAGES_URL" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: docs-browser-published
          path: __tests__/_output/docs-browser/
          if-no-files-found: ignore
